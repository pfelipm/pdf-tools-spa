<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 416" width="960" height="416" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">PDF Tools (SPA) — Suite PDF 100 % local y PWA Offline</title>
  <desc id="bannerDesc">7 herramientas PDF interconectadas en el navegador: Unir, Dividir, Organizar, A imágenes, Editor por capas re-editables, Comprimir y Limpiador de Metadatos, con privacidad total sin servidor.</desc>

  <defs>
    <!-- Fondo principal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="52%" stop-color="#131d3b"/>
      <stop offset="100%" stop-color="#1d1844"/>
    </linearGradient>

    <!-- Brillos ambientales -->
    <radialGradient id="glowBlue" cx="18%" cy="20%" r="52%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="32%" r="46%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="84%" cy="82%" r="42%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>

    <!-- Icono oficial y acentos -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="spaTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="52%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="topAccentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="25%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="90%" stop-color="#2dd4bf" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>

    <!-- Trama sutil de puntos -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.14"/>
    </pattern>

    <!-- Recortes -->
    <clipPath id="bannerClip">
      <rect x="0" y="0" width="960" height="416" rx="22"/>
    </clipPath>
    <clipPath id="appWindowClip">
      <rect x="578" y="34" width="342" height="292" rx="16"/>
    </clipPath>

    <!-- Sombras -->
    <filter id="cardShadow" x="-14%" y="-14%" width="132%" height="136%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <filter id="floatShadow" x="-18%" y="-18%" width="140%" height="145%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020617" flood-opacity="0.62"/>
    </filter>
  </defs>

  <g clip-path="url(#bannerClip)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <rect width="960" height="416" fill="url(#bgGrad)"/>
    <rect width="960" height="416" fill="url(#glowBlue)"/>
    <rect width="960" height="416" fill="url(#glowPurple)"/>
    <rect width="960" height="416" fill="url(#glowTeal)"/>
    <rect width="960" height="416" fill="url(#dotGrid)"/>

    <!-- Línea luminosa superior -->
    <rect x="32" y="1" width="896" height="2.5" fill="url(#topAccentLine)"/>

    <!-- ========================================================= -->
    <!-- COLUMNA IZQUIERDA: IDENTIDAD Y PUNTOS FUERTES             -->
    <!-- ========================================================= -->

    <!-- Etiqueta superior v2.0 -->
    <rect x="40" y="32" width="318" height="34" rx="17" fill="#1e293b" fill-opacity="0.90" stroke="#38bdf8" stroke-opacity="0.40" stroke-width="1.2"/>
    <circle cx="60" cy="49" r="5" fill="#10b981"/>
    <circle cx="60" cy="49" r="9" fill="#10b981" fill-opacity="0.24"/>
    <text x="76" y="54" font-size="14" font-weight="700" fill="#e0f2fe" letter-spacing="0.4">v2.0 · SUITE WEB &amp; PWA OFFLINE</text>

    <!-- Icono oficial + Título principal -->
    <g filter="url(#floatShadow)">
      <rect x="40" y="84" width="72" height="72" rx="18" fill="url(#iconGrad)" stroke="#93c5fd" stroke-opacity="0.38" stroke-width="1.2"/>
      <g transform="translate(55, 98) scale(1.78)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 7h-3a2 2 0 0 1-2-2V2"/>
        <path d="M9 18a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h7l4 4v10a2 2 0 0 1-2 2Z"/>
        <path d="M3 7.6v12.8A1.6 1.6 0 0 0 4.6 22h9.8"/>
      </g>
    </g>

    <text x="128" y="139" font-size="54" font-weight="800" letter-spacing="-1.2" fill="#ffffff">
      PDF Tools <tspan fill="url(#spaTextGrad)">SPA</tspan>
    </text>

    <!-- Subtítulo amplio y legible -->
    <text x="40" y="188" font-size="19.5" font-weight="600" fill="#f1f5f9">
      Edita por capas, une, organiza y comprime tus PDF
    </text>
    <text x="40" y="215" font-size="16" font-weight="400" fill="#cbd5e1">
      100 % en tu navegador · Tus archivos jamás salen de tu equipo
    </text>

    <!-- Cuadrícula 2x2 de insignias grandes -->
    <!-- Fila 1, Col 1: Privacidad -->
    <g transform="translate(40, 238)">
      <rect width="246" height="40" rx="11" fill="#064e3b" fill-opacity="0.52" stroke="#34d399" stroke-opacity="0.48" stroke-width="1.2"/>
      <path d="M22 11.5l7 2.8v4.8c0 4.3-2.9 8-7 9-4.1-1-7-4.7-7-9v-4.8l7-2.8z" fill="none" stroke="#34d399" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M19.2 19.8l2 2 3.8-3.9" fill="none" stroke="#34d399" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="25.5" font-size="15.5" font-weight="700" fill="#ecfdf5">Privacidad 100 % local</text>
    </g>

    <!-- Fila 1, Col 2: PWA Offline -->
    <g transform="translate(298, 238)">
      <rect width="250" height="40" rx="11" fill="#1e3a8a" fill-opacity="0.52" stroke="#60a5fa" stroke-opacity="0.48" stroke-width="1.2"/>
      <path d="M22 12v9.5m0 0l-3.8-3.8M22 21.5l3.8-3.8M15.5 25.5h13" fill="none" stroke="#60a5fa" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="25.5" font-size="15.5" font-weight="700" fill="#eff6ff">Instalable · 100 % Offline</text>
    </g>

    <!-- Fila 2, Col 1: Capas re-editables -->
    <g transform="translate(40, 288)">
      <rect width="246" height="40" rx="11" fill="#4c1d95" fill-opacity="0.52" stroke="#c084fc" stroke-opacity="0.48" stroke-width="1.2"/>
      <path d="M22 12.5l7.5 4-7.5 4-7.5-4 7.5-4zM14.5 20.8L22 24.8l7.5-4" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="25.5" font-size="15.5" font-weight="700" fill="#faf5ff">Capas re-editables</text>
    </g>

    <!-- Fila 2, Col 2: Compresión inteligente -->
    <g transform="translate(298, 288)">
      <rect width="250" height="40" rx="11" fill="#134e4a" fill-opacity="0.56" stroke="#2dd4bf" stroke-opacity="0.48" stroke-width="1.2"/>
      <g transform="translate(11.5, 9.5) scale(0.88)" fill="none" stroke="#2dd4bf" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 14 10 14 10 20"/>
        <polyline points="20 10 14 10 14 4"/>
        <line x1="14" y1="10" x2="21" y2="3"/>
        <line x1="3" y1="21" x2="10" y2="14"/>
      </g>
      <text x="38" y="25.5" font-size="15.5" font-weight="700" fill="#f0fdfa">Compresión inteligente</text>
    </g>

    <!-- ========================================================= -->
    <!-- COLUMNA DERECHA: ILUSTRACIÓN DE INTERFAZ Y CAPAS ACTIVAS  -->
    <!-- ========================================================= -->

    <g filter="url(#cardShadow)">
      <rect x="578" y="34" width="342" height="292" rx="16" fill="#0f172a" fill-opacity="0.92" stroke="#475569" stroke-opacity="0.55" stroke-width="1.2"/>
    </g>

    <g clip-path="url(#appWindowClip)">
      <!-- Cabecera de ventana -->
      <rect x="578" y="34" width="342" height="36" fill="#1e293b"/>
      <line x1="578" y1="70" x2="920" y2="70" stroke="#334155" stroke-width="1"/>
      <circle cx="598" cy="52" r="4.2" fill="#f87171"/>
      <circle cx="611" cy="52" r="4.2" fill="#fbbf24"/>
      <circle cx="624" cy="52" r="4.2" fill="#34d399"/>

      <!-- Mini barra de pestañas superior -->
      <rect x="644" y="42" width="212" height="20" rx="6" fill="#0f172a"/>
      <rect x="648" y="45" width="24" height="14" rx="4" fill="#1e293b"/>
      <rect x="676" y="45" width="24" height="14" rx="4" fill="#1e293b"/>
      <rect x="704" y="45" width="26" height="14" rx="4" fill="#1e293b"/>
      <rect x="734" y="45" width="44" height="14" rx="4" fill="#7c3aed"/>
      <rect x="782" y="45" width="38" height="14" rx="4" fill="#134e4a"/>
      <rect x="824" y="45" width="28" height="14" rx="4" fill="#1e293b"/>
      <rect x="868" y="44" width="38" height="16" rx="5" fill="#1d4ed8" fill-opacity="0.45" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="0.9"/>

      <!-- Barra lateral de miniaturas -->
      <rect x="578" y="70" width="58" height="256" fill="#111827"/>
      <line x1="636" y1="70" x2="636" y2="326" stroke="#1f2937" stroke-width="1"/>
      <rect x="589" y="84" width="36" height="46" rx="4" fill="#ffffff" fill-opacity="0.9"/>
      <rect x="595" y="92" width="18" height="4" rx="1.5" fill="#3b82f6"/>
      <rect x="595" y="100" width="24" height="2.5" rx="1" fill="#cbd5e1"/>
      <rect x="595" y="106" width="20" height="2.5" rx="1" fill="#cbd5e1"/>

      <rect x="586" y="140" width="42" height="52" rx="6" fill="#1e3a8a" fill-opacity="0.55" stroke="#60a5fa" stroke-width="1.5"/>
      <rect x="590" y="144" width="34" height="44" rx="3" fill="#ffffff"/>
      <rect x="595" y="151" width="20" height="3.5" rx="1" fill="#1e293b"/>
      <rect x="595" y="158" width="24" height="3.5" rx="1" fill="#fde047"/>
      <rect x="595" y="165" width="22" height="10" rx="2" fill="#dbeafe"/>
      <rect x="595" y="179" width="18" height="3" rx="1" fill="#86efac"/>

      <rect x="589" y="202" width="36" height="46" rx="4" fill="#ffffff" fill-opacity="0.85"/>
      <rect x="595" y="210" width="22" height="3" rx="1" fill="#94a3b8"/>
      <rect x="595" y="217" width="24" height="3" rx="1" fill="#cbd5e1"/>

      <!-- Hoja PDF central sobre el lienzo -->
      <g filter="url(#floatShadow)">
        <rect x="654" y="84" width="194" height="226" rx="8" fill="#ffffff"/>
      </g>

      <!-- Contenido vectorial de la hoja PDF -->
      <rect x="672" y="100" width="44" height="8" rx="3" fill="#2563eb"/>
      <rect x="672" y="115" width="128" height="7" rx="3" fill="#0f172a"/>
      <rect x="672" y="130" width="156" height="4.5" rx="2" fill="#cbd5e1"/>

      <!-- Resaltado fluorescente amarillo -->
      <rect x="670" y="140" width="142" height="10" rx="3" fill="#fde047" fill-opacity="0.82"/>
      <rect x="672" y="143" width="136" height="4" rx="2" fill="#334155"/>

      <!-- Bloque gráfico / tabla dentro del PDF -->
      <rect x="672" y="159" width="156" height="56" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="684" y="190" width="16" height="18" rx="2.5" fill="#93c5fd"/>
      <rect x="706" y="178" width="16" height="30" rx="2.5" fill="#60a5fa"/>
      <rect x="728" y="168" width="16" height="40" rx="2.5" fill="#3b82f6"/>
      <rect x="750" y="182" width="16" height="26" rx="2.5" fill="#818cf8"/>
      <!-- Marco de selección morado -->
      <rect x="724" y="164" width="24" height="46" rx="3" fill="none" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="3 2"/>

      <!-- Líneas inferiores + resaltado fluorescente verde -->
      <rect x="672" y="226" width="148" height="4.5" rx="2" fill="#cbd5e1"/>
      <rect x="670" y="236" width="122" height="10" rx="3" fill="#86efac" fill-opacity="0.78"/>
      <rect x="672" y="239" width="116" height="4" rx="2" fill="#334155"/>
      <rect x="672" y="252" width="96" height="4.5" rx="2" fill="#cbd5e1"/>

      <!-- Rúbrica caligráfica azul -->
      <path d="M760 286 C770 269, 783 271, 779 284 C776 293, 794 272, 805 281 C811 286, 822 280, 829 275 M754 292 Q792 288 832 286"
            fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Contorno de ventana -->
    <rect x="578" y="34" width="342" height="292" rx="16" fill="none" stroke="#64748b" stroke-opacity="0.45" stroke-width="1"/>

    <!-- Tarjeta flotante 1: Capas editables (grande y nítida) -->
    <g filter="url(#floatShadow)">
      <rect x="768" y="88" width="164" height="44" rx="12" fill="#2e1065" stroke="#c084fc" stroke-opacity="0.85" stroke-width="1.4"/>
      <circle cx="790" cy="110" r="10" fill="#7c3aed" fill-opacity="0.5"/>
      <path d="M786 110l2.8 2.8 5.4-5.4" fill="none" stroke="#f3e8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="807" y="115.5" font-size="15" font-weight="700" fill="#faf5ff">Capa editable</text>
    </g>
    <path d="M768 114 C752 122, 744 142, 736 164" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>
    <circle cx="736" cy="164" r="3.8" fill="#c084fc"/>

    <!-- Tarjeta flotante 2: Ahorro de compresión (grande y nítida) -->
    <g filter="url(#floatShadow)">
      <rect x="780" y="218" width="152" height="58" rx="12" fill="#0f292e" stroke="#2dd4bf" stroke-opacity="0.85" stroke-width="1.4"/>
      <text x="796" y="242" font-size="17" font-weight="800" fill="#5eead4">-21,9 % peso</text>
      <text x="796" y="262" font-size="13.5" font-weight="600" fill="#ccfbf1">Texto y capas OK</text>
    </g>

    <!-- Tarjeta flotante 3: Sin metadatos -->
    <g filter="url(#floatShadow)">
      <rect x="586" y="274" width="152" height="38" rx="11" fill="#083344" stroke="#22d3ee" stroke-opacity="0.85" stroke-width="1.3"/>
      <circle cx="605" cy="293" r="5.5" fill="#22d3ee"/>
      <text x="618" y="298" font-size="14.5" font-weight="700" fill="#ecfeff">Sin metadatos</text>
    </g>

    <!-- ========================================================= -->
    <!-- BARRA INFERIOR DE ANCHO COMPLETO: LAS 7 HERRAMIENTAS      -->
    <!-- ========================================================= -->
    <rect x="40" y="350" width="880" height="42" rx="12" fill="#0f172a" fill-opacity="0.78" stroke="#334155" stroke-opacity="0.8" stroke-width="1"/>

    <g transform="translate(0, 376.5)" font-size="15.5" font-weight="700" fill="#f1f5f9">
      <circle cx="66" cy="-5.5" r="5" fill="#3b82f6"/>
      <text x="78" y="0">Unir</text>

      <circle cx="156" cy="-5.5" r="5" fill="#6366f1"/>
      <text x="168" y="0">Dividir</text>

      <circle cx="262" cy="-5.5" r="5" fill="#f97316"/>
      <text x="274" y="0">Organizar</text>

      <circle cx="396" cy="-5.5" r="5" fill="#22c55e"/>
      <text x="408" y="0">A imágenes</text>

      <circle cx="542" cy="-5.5" r="5" fill="#a855f7"/>
      <text x="554" y="0">Editar</text>

      <circle cx="646" cy="-5.5" r="5" fill="#14b8a6"/>
      <text x="658" y="0">Comprimir</text>

      <circle cx="786" cy="-5.5" r="5" fill="#06b6d4"/>
      <text x="798" y="0">Metadatos</text>
    </g>

    <!-- Borde interior sutil para contraste perfecto en GitHub Dark y Light -->
    <rect x="0.75" y="0.75" width="958.5" height="414.5" rx="21.25" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
  </g>
</svg>
